version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: restuarant_id
        tests: [not_null]

  - name: stg_order_item
    columns:
      - name: order_item_id
        tests: [unique, not_null]

  - name: stg_restuarants
    columns:
      - name: restuarant_id
        tests: [unique, not_null]

  - name: stg_users
    columns:
      - name: customer_id
        tests: [unique, not_null]

  - name: stg_reviews
    columns:
      - name: review_id
        tests: [unique, not_null]